services:
  mongo:
    image: mongo:7.0
    container_name: ecommerce-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD-SHELL', "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce-network

  mongo-init:
    image: mongo:7.0
    container_name: ecommerce-mongo-init
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ecommerce-network
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --eval
      - |
        try {
          var status = rs.status();
          if (status.ok === 1) {
            console.log("Replica set rs0 is already initialized.");
          }
        } catch (e) {
          console.log("Initializing replica set rs0...");
          var cfg = {
            _id: "rs0",
            members: [{ _id: 0, host: "mongo:27017" }]
          };
          var res = rs.initiate(cfg);
          console.log("Replica set initiation result:", JSON.stringify(res));
        }

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/ecommerce?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

volumes:
  mongo_data:
  redis_data:

networks:
  ecommerce-network:
    driver: bridge
